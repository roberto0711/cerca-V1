<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cerca - Todo cerca tuyo</title>
<meta name="description" content="Cerca conecta vecinos con comercios locales.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 5C28 5 10 23 10 45c0 28 40 50 40 50s40-22 40-50C90 23 72 5 50 5z' fill='%232E7D32'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/plus-jakarta-sans@latest/latin-700-normal.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/plus-jakarta-sans@latest/latin-800-normal.css" />

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, doc, addDoc, updateDoc, query, where, orderBy, onSnapshot, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "TU_API_KEY_AQUI",
    authDomain: "cerca-app.firebaseapp.com",
    projectId: "cerca-app",
    storageBucket: "cerca-app.appspot.com",
    messagingSenderId: "TU_SENDER_ID",
    appId: "TU_APP_ID"
  };

  let app, auth, db, storage;
  let firebaseReady = false;

  try {
    if (firebaseConfig.apiKey !== "TU_API_KEY_AQUI") {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      storage = getStorage(app);
      firebaseReady = true;
      console.log("✅ Firebase inicializado");
    } else {
      console.warn("⚠️ Firebase no configurado - modo demo");
    }
  } catch (error) {
    console.error("❌ Error Firebase:", error);
  }

  const FirestoreService = {
    watchStores(cb) {
      if (!firebaseReady) return this._mock(cb, window._mockStores);
      return onSnapshot(query(collection(db, "stores"), orderBy("name")), s => {
        cb(s.docs.map(d => ({ id: d.id, ...d.data(), location: d.data().location ? { lat: d.data().location.latitude, lng: d.data().location.longitude } : {lat:0,lng:0} })));
      });
    },
    async updateStoreStatus(id, isOpen) {
      if (!firebaseReady) return;
      await updateDoc(doc(db, "stores", id), { isOpen });
    },
    watchProductsByStore(storeId, cb) {
      if (!firebaseReady) return this._mock(cb, window._mockProducts[storeId] || []);
      return onSnapshot(query(collection(db, "products"), where("storeId","==",storeId), where("isAvailable","==",true), orderBy("name")), s => {
        cb(s.docs.map(d => ({ id: d.id, ...d.data() })));
      });
    },
    watchAllProducts(cb) {
      if (!firebaseReady) return this._mock(cb, Object.values(window._mockProducts).flat());
      return onSnapshot(query(collection(db, "products"), where("isAvailable","==",true)), s => {
        cb(s.docs.map(d => ({ id: d.id, ...d.data() })));
      });
    },
    async createProduct(data) {
      if (!firebaseReady) {
        const id = 'p' + Date.now();
        const p = { id, ...data, isAvailable: true };
        if (!window._mockProducts[data.storeId]) window._mockProducts[data.storeId] = [];
        window._mockProducts[data.storeId].push(p);
        return id;
      }
      const ref = await addDoc(collection(db, "products"), { ...data, isAvailable: true, createdAt: serverTimestamp() });
      return ref.id;
    },
    async updateProduct(id, data) {
      if (!firebaseReady) return;
      await updateDoc(doc(db, "products", id), data);
    },
    async deleteProduct(id) {
      if (!firebaseReady) return;
      await updateDoc(doc(db, "products", id), { isAvailable: false });
    },
    watchReviewsByStore(storeId, cb) {
      if (!firebaseReady) return this._mock(cb, window._mockReviews[storeId] || []);
      return onSnapshot(query(collection(db, "stores", storeId, "reviews"), orderBy("createdAt","desc")), s => {
        cb(s.docs.map(d => ({ id: d.id, ...d.data() })));
      });
    },
    async addReview(storeId, data) {
      if (!firebaseReady) {
        if (!window._mockReviews[storeId]) window._mockReviews[storeId] = [];
        window._mockReviews[storeId].unshift({ id: 'r'+Date.now(), ...data, createdAt: new Date() });
        return;
      }
      await addDoc(collection(db, "stores", storeId, "reviews"), { ...data, createdAt: serverTimestamp() });
    },
    async toggleFavorite(userId, storeId, isFav) {
      if (!firebaseReady) return;
      const ref = doc(db, "users", userId, "favorites", storeId);
      if (isFav) await setDoc(ref, { storeId, createdAt: serverTimestamp() });
      else await deleteDoc(ref);
    },
    async uploadImage(file, path) {
      if (!firebaseReady) throw new Error("Firebase no configurado");
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, file);
      return await getDownloadURL(storageRef);
    },
    _mock(cb, data) { setTimeout(() => cb(data), 100); return () => {}; }
  };

  const AuthService = {
    currentUser: null, listeners: [],
    init() {
      if (!firebaseReady) {
        this.currentUser = { uid: 'demo-user', displayName: 'Demo', isAnonymous: true };
        this._notify(); return;
      }
      onAuthStateChanged(auth, u => { this.currentUser = u; this._notify(); });
    },
    async signInWithGoogle() {
      if (!firebaseReady) { this.currentUser = { uid: 'demo', displayName: 'Demo', isAnonymous: false }; this._notify(); return; }
      return (await signInWithPopup(auth, new GoogleAuthProvider())).user;
    },
    async signInAnonymously() {
      if (!firebaseReady) { this.currentUser = { uid: 'demo', displayName: 'Invitado', isAnonymous: true }; this._notify(); return; }
      return (await signInAnonymously(auth)).user;
    },
    async signOutUser() {
      if (!firebaseReady) { this.currentUser = null; this._notify(); return; }
      await signOut(auth);
    },
    onAuthChange(cb) { this.listeners.push(cb); if (this.currentUser) cb(this.currentUser); },
    _notify() { this.listeners.forEach(cb => cb(this.currentUser)); }
  };

  window.FirestoreService = FirestoreService;
  window.AuthService = AuthService;
  window.firebaseReady = () => firebaseReady;
</script>

<style>

  .input-field { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 14px; outline: none; font-family: inherit; background: white; color: #1B1B1B; }
  .input-field:focus { border-color: #2E7D32; }

<div class="phone-frame">
  <div class="notch"></div>
  <div class="phone-screen">
    <div class="screen-content">
      <div class="firebase-banner demo" id="firebase-banner">
        <span class="dot"></span>
        <span id="firebase-status-text">Modo Demo</span>
      </div>

      <div class="page active" id="page-home">
        <div class="app-bar">
          <div class="brand-logo">
            <div class="brand-logo-icon">
              <svg width="22" height="22" viewBox="0 0 100 100"><path d="M50 5C28 5 10 23 10 45c0 28 40 50 40 50s40-22 40-50C90 23 72 5 50 5z" fill="#2E7D32"/><path d="M50 30c-8 0-14 6-14 14 0 11 14 21 14 21s14-10 14-21c0-8-6-14-14-14zm0 18c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4z" fill="white"/></svg>
            </div>
            <div>
              <div class="brand-name">Cerca</div>
              <div class="brand-tagline">TODO CERCA TUYO</div>
            </div>
          </div>
          <div class="flex gap-2 items-center">
            <div class="cursor-pointer" onclick="openSearch()"><i class="fas fa-search text-lg"></i></div>

          <div class="flex justify-between items-center mb-3">

            <div class="ml-2"><div class="font-bold text-base">Mi cuenta</div></div>
          </div>
        </div>
        <div class="p-5" id="user-menu-content"></div>
      </div>

      <div class="page" id="page-merchant-access">

function init() {
  updateFirebaseBanner();
  window.AuthService.init();
  window.AuthService.onAuthChange(u => { currentUser = u; updateUserMenuBtn(); });
  window.FirestoreService.watchStores(s => { storesData = s; renderCategoryFilters(); renderStoresList(); updateMapMarkers(); });

  renderCategoryFilters();
  initMap();
  updateFavCount();

function updateFirebaseBanner() {
  const b = document.getElementById('firebase-banner'), t = document.getElementById('firebase-status-text');
  if (window.firebaseReady()) { b.classList.remove('demo'); b.classList.add('connected'); t.textContent = 'Firebase conectado'; }
  else { b.classList.remove('connected'); b.classList.add('demo'); t.textContent = 'Modo Demo'; }
}

function updateUserMenuBtn() {
  const b = document.getElementById('user-menu-btn');

    const n = currentUser.displayName || 'Usuario';
    b.innerHTML = `<i class="fas fa-user-check mr-1"></i>${n.split(' ')[0]}`;
  } else b.innerHTML = `<i class="fas fa-user mr-1"></i>Ingresar`;
}

        <button class="btn-secondary" onclick="handleAnonymousSignIn()"><i class="fas fa-user-secret mr-2"></i>Continuar como invitado</button>
      </div>`;

}

window.handleGoogleSignIn = async () => { try { await window.AuthService.signInWithGoogle(); showToast('✅ Sesión iniciada'); goBack(); } catch(e) { showToast('❌ ' + e.message); } };
window.handleAnonymousSignIn = async () => { try { await window.AuthService.signInAnonymously(); showToast('✅ Invitado'); goBack(); } catch(e) { showToast('❌ ' + e.message); } };
window.handleSignOut = async () => { await window.AuthService.signOutUser(); showToast('👋 Sesión cerrada'); goBack(); };

function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-34.6037, -58.3816], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  const ui = L.divIcon({ className: '', html: '<div class="user-marker"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });
  userMarker = L.marker([-34.6037, -58.3816], { icon: ui }).addTo(map);
  userMarker.bindPopup('<b>Vos estás acá</b>').openPopup();
  updateMapMarkers();
}

function updateMapMarkers() {
  map.eachLayer(l => { if (l !== userMarker && !(l instanceof L.TileLayer)) map.removeLayer(l); });
  getFilteredStores().forEach(s => {
    const f = favorites.includes(s.id);
    const mi = L.divIcon({ className: '', html: `<div class="custom-marker ${s.isOpen ? '' : 'closed'} ${f ? 'favorite' : ''}"><i class="fas fa-${f ? 'heart' : 'store'}"></i></div>`, iconSize: [36, 36], iconAnchor: [18, 36] });
    const m = L.marker([s.location.lat, s.location.lng], { icon: mi }).addTo(map);
    m.on('click', () => openStore(s.id));
    m.bindPopup(`<b>${s.name}</b><br>${s.category}<br><i>${s.isOpen ? '🟢 Abierto' : '🔴 Cerrado'}</i>`);
  });
}

function renderCategoryFilters() {
  document.getElementById('category-filters').innerHTML = categories.map(c => `<div class="chip ${c === selectedCategory ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</div>`).join('');
}

window.selectCategory = c => { selectedCategory = c; renderCategoryFilters(); renderStoresList(); updateMapMarkers(); };
function getFilteredStores() { return selectedCategory === 'Todos' ? storesData : storesData.filter(s => s.category === selectedCategory); }

function renderStoresList() {
  const c = document.getElementById('stores-list'), f = getFilteredStores();
  document.getElementById('store-count').textContent = `${f.length} encontrados`;
  c.innerHTML = f.map(s => {
    const d = calculateDistance(-34.6037, -58.3816, s.location.lat, s.location.lng), fv = favorites.includes(s.id);
    return `
      <div class="store-card" onclick="openStore('${s.id}')">
        <div class="relative">
          <img src="${s.imageUrl}" alt="${s.name}" onerror="this.src='https://via.placeholder.com/180x100'">
          <div class="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 flex items-center justify-center cursor-pointer" onclick="toggleFavorite('${s.id}', event)">
            <i class="fas fa-heart text-xs" style="color: ${fv ? '#C62828' : '#ccc'};"></i>
          </div>
        </div>
        <div class="p-2.5">
          <div class="font-bold text-sm truncate">${s.name}</div>
          <div class="text-xs text-gray-500 mt-0.5">${s.category}</div>
          <div class="flex items-center justify-between mt-1.5">
            <div class="flex items-center gap-1">
              <span class="status-dot ${s.isOpen ? 'open' : 'closed'}"></span>
              <span class="text-xs font-semibold" style="color: ${s.isOpen ? '#2E7D32' : '#C62828'}">${s.isOpen ? 'Abierto' : 'Cerrado'}</span>
            </div>
            <span class="text-xs text-gray-500">${d.toFixed(1)} km</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

window.handleHomeSearch = q => {
  const r = document.getElementById('search-results'), cl = document.getElementById('search-clear');
  if (!q || !q.trim()) { r.classList.remove('show'); cl.style.display = 'none'; return; }
  cl.style.display = 'block';
  const ql = q.toLowerCase().trim();
  const ms = storesData.filter(s => s.name.toLowerCase().includes(ql) || s.category.toLowerCase().includes(ql));
  const mp = [];
  Object.entries(productsData).forEach(([sid, ps]) => {
    const st = storesData.find(s => s.id === sid);
    if (!st) return;
    ps.forEach(p => { if (p.isAvailable !== false && (p.name.toLowerCase().includes(ql) || p.description.toLowerCase().includes(ql))) mp.push({ ...p, storeId: sid, storeName: st.name }); });
  });
  if (!ms.length && !mp.length) { r.innerHTML = `<div class="p-6 text-center text-gray-500 text-sm">No encontramos "${q}"</div>`; r.classList.add('show'); return; }
  let h = '';
  if (ms.length) { h += `<div class="search-section-title">Comercios (${ms.length})</div>` + ms.slice(0,5).map(s => `<div class="search-result-item" onclick="selectSearchResult('store','${s.id}')"><img src="${s.imageUrl}" onerror="this.src='https://via.placeholder.com/44'"><div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">${s.name}</div><div class="text-xs text-gray-500">${s.category}</div></div></div>`).join(''); }
  if (mp.length) { h += `<div class="search-section-title">Productos (${mp.length})</div>` + mp.slice(0,5).map(p => `<div class="search-result-item" onclick="selectSearchResult('product','${p.storeId}','${p.id}')"><img src="${p.imageUrl}" onerror="this.src='https://via.placeholder.com/44'"><div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">${p.name}</div><div class="text-xs text-gray-500">${p.storeName} · $${p.price.toLocaleString('es-AR')}</div></div></div>`).join(''); }
  r.innerHTML = h; r.classList.add('show');
};

window.selectSearchResult = (t, sid, pid) => { document.getElementById('search-results').classList.remove('show'); document.getElementById('home-search').value = ''; document.getElementById('search-clear').style.display = 'none'; if (t === 'store') openStore(sid); else openProduct(sid, pid); };
window.clearHomeSearch = () => { document.getElementById('home-search').value = ''; document.getElementById('search-results').classList.remove('show'); document.getElementById('search-clear').style.display = 'none'; };
window.openSearch = () => document.getElementById('home-search').focus();

window.toggleFavorite = async (sid, e) => {
  if (e) e.stopPropagation();
  const s = storesData.find(x => x.id === sid); if (!s) return;
  const isF = favorites.includes(sid);
  if (isF) { favorites = favorites.filter(i => i !== sid); showToast(`💔 ${s.name} eliminado`); }
  else { favorites.push(sid); showToast(`❤️ ${s.name} agregado`); }
  localStorage.setItem('favorites', JSON.stringify(favorites));
  if (currentUser && !currentUser.isAnonymous) try { await window.FirestoreService.toggleFavorite(currentUser.uid, sid, !isF); } catch(e) {}
  updateFavCount(); updateMapMarkers(); renderStoresList();
  const fb = document.getElementById('store-fav-btn');
  if (fb && currentStoreId === sid) fb.classList.toggle('active', !isF);
  if (navigationStack[navigationStack.length - 1] === 'page-favorites') renderFavorites();
};
window.toggleFavoriteFromStore = () => { if (currentStoreId) toggleFavorite(currentStoreId); };

function updateFavCount() {
  const b = document.getElementById('fav-count');
  if (b) { if (favorites.length > 0) { b.textContent = favorites.length; b.style.display = 'flex'; } else b.style.display = 'none'; }
}

window.openFavorites = () => { renderFavorites(); navigateTo('page-favorites'); };

function renderFavorites() {
  const c = document.getElementById('favorites-content'), fs = storesData.filter(s => favorites.includes(s.id));
  if (!fs.length) { c.innerHTML = `<div class="empty-state"><i class="far fa-heart"></i><h3 class="font-bold text-lg mb-2">Sin favoritos</h3><p class="text-sm text-gray-500">Tocá el ❤️ en comercios que te gusten</p><button class="btn-primary mt-6" onclick="goBack()">Explorar</button></div>`; return; }
  c.innerHTML = `<div class="text-xs text-gray-500 mb-3">${fs.length} comercio${fs.length !== 1 ? 's' : ''}</div><div class="flex flex-col gap-3">${fs.map(s => { const d = calculateDistance(-34.6037, -58.3816, s.location.lat, s.location.lng); return `<div class="fav-card" onclick="openStore('${s.id}')"><img src="${s.imageUrl}" onerror="this.src='https://via.placeholder.com/70'"><div class="flex-1 min-w-0"><div class="font-bold text-sm truncate">${s.name}</div><div class="text-xs text-gray-500">${s.category} · ${d.toFixed(1)} km</div><div class="flex items-center gap-1 mt-1"><span class="status-dot ${s.isOpen ? 'open' : 'closed'}"></span><span class="text-xs font-semibold" style="color: ${s.isOpen ? '#2E7D32' : '#C62828'}">${s.isOpen ? 'Abierto' : 'Cerrado'}</span></div></div><div class="action-btn delete" onclick="toggleFavorite('${s.id}', event)"><i class="fas fa-heart text-sm" style="color: #C62828;"></i></div></div>`; }).join('')}</div>`;
}

function navigateTo(p) { document.querySelectorAll('.page').forEach(x => x.classList.remove('active')); document.getElementById(p).classList.add('active'); navigationStack.push(p); document.getElementById(p).scrollTop = 0; }
window.goBack = () => { navigationStack.pop(); const p = navigationStack[navigationStack.length - 1]; document.querySelectorAll('.page').forEach(x => x.classList.remove('active')); document.getElementById(p).classList.add('active'); if (p === 'page-home') setTimeout(() => map.invalidateSize(), 100); };

window.openStore = sid => {
  currentStoreId = sid;
  const s = storesData.find(x => x.id === sid); if (!s) return;
  document.getElementById('store-header').innerHTML = `<div class="hero-image" style="background-image: url('${s.imageUrl}')"><div class="hero-overlay"></div><div class="absolute top-12 left-4 right-4 flex justify-between"><div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left text-gray-800"></i></div><div class="fav-btn ${favorites.includes(sid) ? 'active' : ''}" id="store-fav-btn" onclick="toggleFavoriteFromStore()"><i class="fas fa-heart" style="color: ${favorites.includes(sid) ? 'white' : '#C62828'};"></i></div></div><div class="absolute bottom-4 left-4 right-4"><h1 class="text-white font-bold text-2xl mb-1">${s.name}</h1><div class="flex items-center gap-2"><div class="px-2 py-0.5 rounded-full text-xs font-semibold" style="background: ${s.isOpen ? '#2E7D32' : '#C62828'}; color: white;"><span class="inline-block w-1.5 h-1.5 rounded-full bg-white mr-1"></span>${s.isOpen ? 'Abierto' : 'Cerrado'}</div><div class="flex items-center gap-1 text-white/80 text-xs"><i class="fas fa-tag"></i><span>${s.category}</span></div></div></div></div>`;
  document.getElementById('store-info').innerHTML = `<div class="flex items-start gap-2 text-sm"><i class="fas fa-map-marker-alt mt-0.5" style="color: #2E7D32;"></i><span class="text-gray-700">${s.address}</span></div>${s.description ? `<p class="text-sm text-gray-600 mt-3 leading-relaxed">${s.description}</p>` : ''}`;
  document.getElementById('store-whatsapp-btn').onclick = () => openWhatsApp(s.whatsapp, s.name, null, null);
  window.FirestoreService.watchReviewsByStore(sid, r => { reviewsData[sid] = r; renderReviewsSection(sid); });
  window.FirestoreService.watchProductsByStore(sid, p => { productsData[sid] = p; renderProductsGrid(sid); });
  navigateTo('page-store');
};

function renderProductsGrid(sid) {
  const ps = (productsData[sid] || []).filter(p => p.isAvailable !== false);
  document.getElementById('products-grid').innerHTML = !ps.length ? '<div class="col-span-2 text-center py-10 text-gray-500"><i class="fas fa-box-open text-4xl mb-2"></i><p>Sin productos</p></div>' : ps.map(p => `<div class="product-card" onclick="openProduct('${sid}','${p.id}')"><img src="${p.imageUrl}" onerror="this.src='https://via.placeholder.com/150x120'"><div class="p-2.5"><div class="text-xs font-semibold truncate">${p.name}</div><div class="text-sm font-bold mt-1" style="color: #2E7D32;">$${p.price.toLocaleString('es-AR')}</div></div></div>`).join('');
}

window.openProduct = (sid, pid) => {
  currentStoreId = sid;
  const s = storesData.find(x => x.id === sid), p = (productsData[sid] || []).find(x => x.id === pid);
  if (!s || !p) return;
  document.getElementById('product-image-container').innerHTML = `<div class="relative" style="height: 320px;"><img src="${p.imageUrl}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/390x320'"><div class="absolute top-12 left-4"><div class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left text-gray-800"></i></div></div></div>`;
  document.getElementById('product-details').innerHTML = `<div class="flex justify-between items-start mb-4"><h1 class="text-2xl font-bold flex-1 pr-3">${p.name}</h1><div class="price-tag">$${p.price.toLocaleString('es-AR')}</div></div><div class="mb-4"><h3 class="font-semibold text-base mb-2">Descripción</h3><p class="text-sm text-gray-600 leading-relaxed">${p.description}</p></div><div class="bg-gray-50 rounded-xl p-3 flex items-center gap-3 cursor-pointer" onclick="openStore('${s.id}')"><i class="fas fa-store" style="color: #2E7D32;"></i><div class="flex-1"><div class="text-xs text-gray-500">Vendido por</div><div class="text-sm font-semibold">${s.name}</div></div></div>`;
  document.getElementById('product-whatsapp-btn').onclick = () => openWhatsApp(s.whatsapp, s.name, p.name, p.price);
  navigateTo('page-product');
};

function openWhatsApp(pn, sn, pn2, pr) {
  const cn = pn.replace(/[^0-9]/g, '');
  let m;
  if (pn2) m = `¡Hola! 👋 Te contacto desde *Cerca* 📍\n\nMe interesa:\n🛍️ *${pn2}*\n💰 $${pr.toLocaleString('es-AR')}\n🏪 ${sn}\n\n¿Está disponible?`;
  else m = `¡Hola! 👋 Te contacto desde *Cerca* 📍\nVi tu comercio *${sn}* en la app.`;
  window.open(`https://wa.me/${cn}?text=${encodeURIComponent(m)}`, '_blank');
  showToast('📱 Abriendo WhatsApp...');
}

function renderReviewsSection(sid) {
  const s = storesData.find(x => x.id === sid), rs = reviewsData[sid] || [], c = document.getElementById('reviews-section');
  let ar = s.rating || 0;
  if (rs.length) ar = rs.reduce((a, r) => a + r.rating, 0) / rs.length;
  const sh = r => { let h = ''; for (let i = 1; i <= 5; i++) h += `<i class="fas fa-star" style="color: ${i <= Math.round(r) ? '#F9A825' : '#ddd'};"></i>`; return h; };
  c.innerHTML = `<div class="flex justify-between items-center mb-3"><div><h3 class="font-bold text-base">Reseñas</h3><div class="flex items-center gap-2 mt-1"><div class="stars-display">${sh(ar)}</div><span class="text-xs text-gray-500">${ar.toFixed(1)} · ${rs.length} reseña${rs.length !== 1 ? 's' : ''}</span></div></div><button class="btn-primary" style="width: auto; padding: 8px 16px; font-size: 13px;" onclick="openReviewModal()"><i class="fas fa-pen mr-1"></i>Escribir</button></div>${!rs.length ? `<div class="text-center py-4 text-gray-400 text-xs"><i class="far fa-comment-dots text-2xl mb-2"></i><p>Sé el primero</p></div>` : rs.slice(0,3).map(r => `<div class="review-card"><div class="flex justify-between items-start mb-1"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold" style="background: #E8F5E9; color: #2E7D32;">${(r.userName || 'U').charAt(0).toUpperCase()}</div><div><div class="font-semibold text-xs">${r.userName || 'Usuario'}</div></div></div><div class="stars-display" style="font-size: 11px;">${sh(r.rating)}</div></div>${r.comment ? `<p class="text-xs text-gray-600 mt-2 leading-relaxed">${r.comment}</p>` : ''}</div>`).join('')}`;
}

window.openReviewModal = () => { document.getElementById('review-modal').classList.add('show'); document.querySelectorAll('#star-rating input').forEach(i => i.checked = false); document.getElementById('review-comment').value = ''; };
window.closeReviewModal = () => document.getElementById('review-modal').classList.remove('show');
window.submitReview = async () => {
  const ri = document.querySelector('#star-rating input:checked');
  if (!ri) { showToast('⚠️ Seleccioná calificación'); return; }
  try { await window.FirestoreService.addReview(currentStoreId, { userName: currentUser?.displayName || 'Vecino', rating: parseInt(ri.value), comment: document.getElementById('review-comment').value.trim(), userId: currentUser?.uid || 'anon' }); closeReviewModal(); showToast('✅ ¡Gracias!'); } catch(e) { showToast('❌ Error'); }
};

window.openMerchantAccess = () => { renderMerchantStoresList(); navigateTo('page-merchant-access'); };

function renderMerchantStoresList(f = '') {
  const c = document.getElementById('merchant-stores-list'), fs = storesData.filter(s => s.name.toLowerCase().includes(f.toLowerCase()));
  if (!fs.length) { c.innerHTML = `<div class="text-center py-8 text-gray-500"><i class="fas fa-store-slash text-3xl mb-2"></i><p class="text-sm">No se encontraron</p></div>`; return; }
  c.innerHTML = fs.map(s => `<div class="store-select-card" onclick="selectMerchantStore('${s.id}')"><img src="${s.imageUrl}" onerror="this.src='https://via.placeholder.com/56'"><div class="flex-1 min-w-0"><div class="font-bold text-sm truncate">${s.name}</div><div class="text-xs text-gray-500 truncate">${s.category}</div><div class="flex items-center gap-1 mt-1"><span class="status-dot ${s.isOpen ? 'open' : 'closed'}"></span><span class="text-xs font-semibold" style="color: ${s.isOpen ? '#2E7D32' : '#C62828'}">${s.isOpen ? 'Abierto' : 'Cerrado'}</span></div></div><i class="fas fa-chevron-right text-gray-400"></i></div>`).join('');
}

window.filterMerchantStores = () => renderMerchantStoresList(document.getElementById('merchant-search').value);
window.selectMerchantStore = sid => { currentMerchantStoreId = sid; const s = storesData.find(x => x.id === sid); document.getElementById('merchant-store-name').textContent = s.name; renderMerchantDashboard(); navigateTo('page-merchant-dashboard'); showToast(`✅ ${s.name}`); };
window.logoutMerchant = () => { currentMerchantStoreId = null; navigationStack = ['page-home']; document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('page-home').classList.add('active'); showToast('Sesión cerrada'); };

function renderMerchantDashboard() {
  const s = storesData.find(x => x.id === currentMerchantStoreId); if (!s) return;
  const ps = productsData[currentMerchantStoreId] || [], av = ps.filter(p => p.isAvailable !== false).length;
  document.getElementById('merchant-dashboard-content').innerHTML = `
    <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="${s.imageUrl}" class="w-14 h-14 rounded-xl object-cover" onerror="this.src='https://via.placeholder.com/56'">
          <div><div class="text-xs text-gray-500">Estado actual</div><div class="font-bold text-base" id="status-label" style="color: ${s.isOpen ? '#2E7D32' : '#C62828'}">${s.isOpen ? '🟢 Abierto' : '🔴 Cerrado'}</div></div>
        </div>
        <div class="toggle-switch ${s.isOpen ? 'on' : ''}" id="store-toggle" onclick="toggleStoreStatus()"></div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-2 mb-4">
      <div class="stat-card"><div class="stat-icon" style="background: #E3F2FD; color: #1976D2;"><i class="fas fa-eye"></i></div><div class="text-xl font-bold">${Math.floor(Math.random() * 200) + 50}</div><div class="text-xs text-gray-500">Visitas</div></div>
      <div class="stat-card"><div class="stat-icon" style="background: #E8F5E9; color: #2E7D32;"><i class="fab fa-whatsapp"></i></div><div class="text-xl font-bold">${Math.floor(Math.random() * 40) + 5}</div><div class="text-xs text-gray-500">Consultas</div></div>
      <div class="stat-card"><div class="stat-icon" style="background: #FFF8E1; color: #F9A825;"><i class="fas fa-star"></i></div><div class="text-xl font-bold">${(s.rating || 0).toFixed(1)}</div><div class="text-xs text-gray-500">Rating</div></div>
    </div>
    <div class="flex justify-between items-center mb-3"><div><h3 class="font-bold text-base">Mis productos</h3><div class="text-xs text-gray-500">${av} disponibles</div></div></div>
    <div class="flex flex-col gap-2">
      ${!ps.length ? `<div class="text-center py-10 bg-white rounded-2xl"><i class="fas fa-box-open text-4xl text-gray-300 mb-3"></i><p class="text-gray-500 text-sm">Sin productos</p></div>` : ps.map(p => `<div class="merchant-product-card"><img src="${p.imageUrl}" onerror="this.src='https://via.placeholder.com/64'"><div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">${p.name}</div><div class="text-xs text-gray-500 mt-0.5">$${p.price.toLocaleString('es-AR')}</div></div><div class="flex flex-col gap-1"><div class="action-btn edit" onclick="editProduct('${p.id}')"><i class="fas fa-pen text-xs"></i></div><div class="action-btn delete" onclick="confirmDeleteProduct('${p.id}')"><i class="fas fa-trash text-xs"></i></div></div></div>`).join('')}
    </div>`;
}

window.toggleStoreStatus = async () => {
  const s = storesData.find(x => x.id === currentMerchantStoreId); if (!s) return;
  s.isOpen = !s.isOpen;
  try { await window.FirestoreService.updateStoreStatus(currentMerchantStoreId, s.isOpen); } catch(e) {}
  document.getElementById('store-toggle').classList.toggle('on');
  const l = document.getElementById('status-label');
  l.innerHTML = s.isOpen ? '🟢 Abierto' : '🔴 Cerrado';
  l.style.color = s.isOpen ? '#2E7D32' : '#C62828';
  showToast(s.isOpen ? '🟢 ABIERTO' : '🔴 CERRADO');
  updateMapMarkers(); renderStoresList();
};

window.openProductForm = (pid = null) => {
  editingProductId = pid; uploadedImageUrl = null;
  document.getElementById('image-preview').classList.add('hidden');
  document.getElementById('p-image-file').value = '';
  document.getElementById('p-image-url').value = '';
  const t = document.getElementById('product-form-title');
  if (pid) {
    const p = (productsData[currentMerchantStoreId] || []).find(x => x.id === pid);
    if (p) { t.textContent = 'Editar producto'; document.getElementById('p-name').value = p.name; document.getElementById('p-price').value = p.price; document.getElementById('p-description').value = p.description; document.getElementById('p-image-url').value = p.imageUrl; }
  } else { t.textContent = 'Nuevo producto'; document.getElementById('p-name').value = ''; document.getElementById('p-price').value = ''; document.getElementById('p-description').value = ''; }
  document.getElementById('product-modal').classList.add('show');
};
window.closeProductForm = () => { document.getElementById('product-modal').classList.remove('show'); editingProductId = null; };
window.handleImageUpload = async e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { document.getElementById('preview-img').src = ev.target.result; document.getElementById('image-preview').classList.remove('hidden'); uploadedImageUrl = ev.target.result; };
  r.readAsDataURL(f);
  if (window.firebaseReady()) {
    try { showToast('📤 Subiendo...'); const url = await window.FirestoreService.uploadImage(f, `products/${currentMerchantStoreId}/${Date.now()}_${f.name}`); uploadedImageUrl = url; document.getElementById('p-image-url').value = url; showToast('✅ Imagen subida'); } catch(e) { showToast('❌ Error al subir'); }
  }
};
window.saveProduct = async () => {
  const n = document.getElementById('p-name').value.trim(), p = parseFloat(document.getElementById('p-price').value), d = document.getElementById('p-description').value.trim(), i = document.getElementById('p-image-url').value.trim() || uploadedImageUrl || 'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=400';
  if (!n || isNaN(p) || !d) { showToast('⚠️ Completá todos los campos'); return; }
  try {
    if (editingProductId) { await window.FirestoreService.updateProduct(editingProductId, { name: n, price: p, description: d, imageUrl: i }); showToast('✅ Actualizado'); }
    else { await window.FirestoreService.createProduct({ storeId: currentMerchantStoreId, name: n, price: p, description: d, imageUrl: i }); showToast('✅ Agregado'); }
    closeProductForm(); renderMerchantDashboard();
  } catch(e) { showToast('❌ Error'); }
};
window.editProduct = pid => openProductForm(pid);
window.confirmDeleteProduct = async pid => {
  if (!confirm('¿Eliminar?')) return;
  try { await window.FirestoreService.deleteProduct(pid); showToast('🗑️ Eliminado'); renderMerchantDashboard(); } catch(e) { showToast('❌ Error'); }
};

function calculateDistance(lat1, lng1, lat2, lng2) {
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

window.navigateTo = navigateTo;
init();
</script>

</body>
